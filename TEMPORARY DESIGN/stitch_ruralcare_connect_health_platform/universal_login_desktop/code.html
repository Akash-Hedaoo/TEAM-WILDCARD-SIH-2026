<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Universal OTP Login - Rural Health Commons</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-container": "#6cf8bb",
                      "tertiary-container": "#996100",
                      "surface-variant": "#e0e3e5",
                      "secondary": "#006c49",
                      "on-secondary-fixed-variant": "#005236",
                      "secondary-fixed": "#6ffbbe",
                      "on-secondary-container": "#00714d",
                      "on-background": "#191c1e",
                      "primary-container": "#2563eb",
                      "inverse-surface": "#2d3133",
                      "surface-container-low": "#f2f4f6",
                      "on-error-container": "#93000a",
                      "on-error": "#ffffff",
                      "tertiary-fixed": "#ffddb8",
                      "primary-fixed": "#dbe1ff",
                      "surface-container-high": "#e6e8ea",
                      "surface-container": "#eceef0",
                      "on-primary": "#ffffff",
                      "secondary-fixed-dim": "#4edea3",
                      "background": "#f7f9fb",
                      "primary": "#004ac6",
                      "on-primary-container": "#eeefff",
                      "surface-tint": "#0053db",
                      "error-container": "#ffdad6",
                      "outline-variant": "#c3c6d7",
                      "tertiary": "#784b00",
                      "on-primary-fixed": "#00174b",
                      "outline": "#737686",
                      "on-tertiary-container": "#ffeedd",
                      "surface-bright": "#f7f9fb",
                      "surface": "#f7f9fb",
                      "on-tertiary-fixed-variant": "#653e00",
                      "on-secondary-fixed": "#002113",
                      "surface-container-lowest": "#ffffff",
                      "inverse-primary": "#b4c5ff",
                      "surface-dim": "#d8dadc",
                      "error": "#ba1a1a",
                      "on-tertiary": "#ffffff",
                      "primary-fixed-dim": "#b4c5ff",
                      "inverse-on-surface": "#eff1f3",
                      "on-surface-variant": "#434655",
                      "on-tertiary-fixed": "#2a1700",
                      "on-secondary": "#ffffff",
                      "on-primary-fixed-variant": "#003ea8",
                      "tertiary-fixed-dim": "#ffb95f",
                      "on-surface": "#191c1e",
                      "surface-container-highest": "#e0e3e5"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xs": "4px",
                      "base": "4px",
                      "md": "16px",
                      "container-margin-desktop": "48px",
                      "sm": "8px",
                      "lg": "24px",
                      "container-margin-mobile": "16px",
                      "gutter": "16px",
                      "xl": "32px"
              },
              "fontFamily": {
                      "headline-lg": ["Inter"],
                      "label-md": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "body-lg": ["Inter"],
                      "body-md": ["Inter"],
                      "body-sm": ["Inter"],
                      "headline-xl": ["Inter"],
                      "headline-md": ["Inter"],
                      "label-sm": ["Inter"]
              },
              "fontSize": {
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}]
              }
            }
          }
        }
    </script>
<style>
        body {
            background-color: #f7f9fb;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .shadow-ambient {
            box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.02), 0 1px 3px 0 rgba(0, 0, 0, 0.01);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<!-- Main Content Canvas -->
<main class="w-full max-w-lg bg-surface-container-lowest border border-surface-variant rounded-xl shadow-ambient p-lg flex flex-col gap-lg">
<!-- Header -->
<header class="flex flex-col items-center text-center">
<h1 class="text-headline-md font-headline-md text-primary">Rural Health Commons</h1>
<p class="text-body-md font-body-md text-on-surface-variant mt-sm">Universal Access Portal</p>
</header>
<!-- Segmented Control for Role -->
<div class="bg-surface-container-high rounded-lg p-1 flex">
<button class="flex-1 text-label-md font-label-md py-2 px-4 rounded-md bg-surface-container-lowest text-primary shadow-sm transition-colors" onclick="selectRole(this)">Patient</button>
<button class="flex-1 text-label-md font-label-md py-2 px-4 rounded-md text-on-surface-variant hover:text-on-surface transition-colors" onclick="selectRole(this)">ASHA</button>
<button class="flex-1 text-label-md font-label-md py-2 px-4 rounded-md text-on-surface-variant hover:text-on-surface transition-colors" onclick="selectRole(this)">Doctor</button>
<button class="flex-1 text-label-md font-label-md py-2 px-4 rounded-md text-on-surface-variant hover:text-on-surface transition-colors" onclick="selectRole(this)">Admin</button>
</div>
<!-- Login Form -->
<div class="flex flex-col gap-md mt-sm" id="login-step-1">
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface" for="mobile-number">Mobile Number</label>
<div class="relative">
<span aria-hidden="true" class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">phone_iphone</span>
<input class="w-full h-12 pl-10 pr-4 rounded-lg border border-outline-variant bg-surface-container-lowest text-body-md font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="mobile-number" placeholder="+91 00000 00000" type="tel"/>
</div>
</div>
<button class="w-full h-12 bg-primary text-on-primary text-label-md font-label-md rounded-lg flex items-center justify-center gap-sm hover:bg-primary-fixed-variant transition-colors mt-sm" onclick="showOTP()" type="button">
                Send OTP
                <span aria-hidden="true" class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
<!-- OTP Form (Hidden initially) -->
<div class="hidden flex-col gap-md mt-sm" id="login-step-2">
<div class="flex flex-col gap-xs">
<label class="text-label-md font-label-md text-on-surface text-center">Enter 6-digit OTP sent to your number</label>
<div class="flex justify-center gap-2 mt-2">
<input autofocus="" class="w-12 h-14 text-center text-headline-md font-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-headline-md font-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-headline-md font-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary" maxlength="1" type="text"/>
<span class="w-4 flex items-center justify-center text-outline-variant">-</span>
<input class="w-12 h-14 text-center text-headline-md font-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-headline-md font-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary" maxlength="1" type="text"/>
<input class="w-12 h-14 text-center text-headline-md font-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary" maxlength="1" type="text"/>
</div>
</div>
<div class="flex flex-col gap-sm mt-sm">
<button class="w-full h-12 bg-primary text-on-primary text-label-md font-label-md rounded-lg flex items-center justify-center gap-sm hover:bg-primary-fixed-variant transition-colors" type="button">
                    Verify &amp; Login
                </button>
<button class="w-full h-12 bg-transparent text-primary text-label-md font-label-md rounded-lg flex items-center justify-center gap-sm hover:bg-surface-container-high transition-colors" onclick="resetLogin()" type="button">
                    Back
                </button>
</div>
<p class="text-body-sm font-body-sm text-on-surface-variant text-center mt-2">Resend OTP in 00:30</p>
</div>
<!-- Footer / Compliance -->
<footer class="mt-md border-t border-surface-variant pt-md">
<div class="flex items-center gap-sm text-body-sm font-body-sm text-on-surface-variant">
<span aria-hidden="true" class="material-symbols-outlined text-[16px] text-secondary">verified_user</span>
<p>Secured via end-to-end encryption. Health records are compliant with regional data protection acts.</p>
</div>
</footer>
</main>
<script>
        function selectRole(selectedBtn) {
            const buttons = selectedBtn.parentElement.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                btn.classList.add('text-on-surface-variant');
            });
            
            selectedBtn.classList.remove('text-on-surface-variant');
            selectedBtn.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
        }

        function showOTP() {
            document.getElementById('login-step-1').classList.add('hidden');
            document.getElementById('login-step-1').classList.remove('flex');
            
            document.getElementById('login-step-2').classList.remove('hidden');
            document.getElementById('login-step-2').classList.add('flex');
            
            // Auto focus first input
            setTimeout(() => {
                document.querySelector('#login-step-2 input').focus();
            }, 100);
        }

        function resetLogin() {
            document.getElementById('login-step-2').classList.add('hidden');
            document.getElementById('login-step-2').classList.remove('flex');
            
            document.getElementById('login-step-1').classList.remove('hidden');
            document.getElementById('login-step-1').classList.add('flex');
        }

        // Basic OTP input auto-advance
        const inputs = document.querySelectorAll('#login-step-2 input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                if(this.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', function(e) {
                if(e.key === 'Backspace' && !this.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });
    </script>
</body></html>
