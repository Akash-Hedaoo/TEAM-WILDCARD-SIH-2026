<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI E-Rx Approval Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed": "#6ffbbe",
                    "primary-container": "#2563eb",
                    "surface-dim": "#d8dadc",
                    "inverse-surface": "#2d3133",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#f2f4f6",
                    "on-tertiary-fixed": "#2a1700",
                    "secondary": "#006c49",
                    "on-primary-fixed": "#00174b",
                    "surface-container-high": "#e6e8ea",
                    "on-secondary": "#ffffff",
                    "surface-container-highest": "#e0e3e5",
                    "on-tertiary-fixed-variant": "#653e00",
                    "primary": "#004ac6",
                    "on-primary": "#ffffff",
                    "surface-container": "#eceef0",
                    "on-secondary-container": "#00714d",
                    "surface-variant": "#e0e3e5",
                    "on-surface": "#191c1e",
                    "surface-container-lowest": "#ffffff",
                    "error": "#ba1a1a",
                    "outline": "#737686",
                    "on-background": "#191c1e",
                    "tertiary-fixed": "#ffddb8",
                    "on-secondary-fixed-variant": "#005236",
                    "secondary-fixed-dim": "#4edea3",
                    "surface-tint": "#0053db",
                    "on-primary-fixed-variant": "#003ea8",
                    "on-tertiary-container": "#ffeedd",
                    "on-primary-container": "#eeefff",
                    "secondary-container": "#6cf8bb",
                    "tertiary-container": "#996100",
                    "on-tertiary": "#ffffff",
                    "on-surface-variant": "#434655",
                    "tertiary": "#784b00",
                    "inverse-on-surface": "#eff1f3",
                    "tertiary-fixed-dim": "#ffb95f",
                    "on-secondary-fixed": "#002113",
                    "on-error": "#ffffff",
                    "surface-bright": "#f7f9fb",
                    "error-container": "#ffdad6",
                    "background": "#f7f9fb",
                    "primary-fixed": "#dbe1ff",
                    "inverse-primary": "#b4c5ff",
                    "outline-variant": "#c3c6d7",
                    "primary-fixed-dim": "#b4c5ff",
                    "surface": "#f7f9fb"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-margin-desktop": "48px",
                    "container-margin-mobile": "16px",
                    "gutter": "16px",
                    "sm": "8px",
                    "xl": "32px",
                    "xs": "4px",
                    "base": "4px",
                    "lg": "24px",
                    "md": "16px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "label-sm": ["Inter"],
                    "headline-md": ["Inter"],
                    "body-sm": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "label-md": ["Inter"],
                    "headline-xl": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .backdrop-blur-md {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md">
<!-- Top Navigation Anchor (Inactive background context) -->
<header class="bg-surface shadow-sm w-full px-container-margin-desktop h-16 flex justify-between items-center hidden md:flex sticky top-0 z-10">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary text-3xl">local_hospital</span>
<span class="text-headline-md font-headline-md font-bold text-primary">Rural Health Commons</span>
</div>
<nav class="flex gap-8">
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors text-label-md font-label-md" href="#">Dashboard</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors text-label-md font-label-md" href="#">Triage</a>
<a class="text-primary font-bold border-b-2 border-primary pb-1 text-label-md font-label-md" href="#">E-Prescriptions</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors text-label-md font-label-md" href="#">Patient Queue</a>
</nav>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined">sync</span></button>
<button class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined">notifications</span></button>
<button class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined">account_circle</span></button>
</div>
</header>
<!-- Main Content Context (Blurred out by modal) -->
<main class="p-container-margin-desktop max-w-7xl mx-auto space-y-lg blur-sm">
<!-- Dashboard background content goes here -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-lg">
<div class="bg-surface-container-lowest p-lg rounded-xl shadow-sm border border-outline-variant/30 h-64"></div>
<div class="bg-surface-container-lowest p-lg rounded-xl shadow-sm border border-outline-variant/30 h-64"></div>
<div class="bg-surface-container-lowest p-lg rounded-xl shadow-sm border border-outline-variant/30 h-64"></div>
</div>
</main>
<!-- Overlay / Modal -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-container-margin-mobile sm:p-container-margin-desktop bg-on-background/40 backdrop-blur-md">
<!-- Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-3xl rounded-xl shadow-2xl border border-outline-variant flex flex-col overflow-hidden max-h-[90vh]">
<!-- Header -->
<div class="px-lg py-md border-b border-outline-variant/50 bg-surface-bright flex justify-between items-center sticky top-0 z-10">
<div class="flex items-center gap-sm">
<div class="bg-primary-container text-on-primary-container p-sm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-weight="fill">smart_toy</span>
</div>
<div>
<h2 class="text-headline-md font-headline-md text-on-surface">Review AI-Generated Prescription</h2>
<p class="text-body-sm font-body-sm text-on-surface-variant mt-xs">Patient: Maria Gonzalez • ID: #RHC-8492</p>
</div>
</div>
<button class="text-on-surface-variant hover:text-error transition-colors p-sm rounded-full hover:bg-error-container/20">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Body (Scrollable) -->
<div class="p-lg overflow-y-auto flex-1 space-y-xl">
<!-- Diagnosis Section -->
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface" for="diagnosis">Final Diagnosis</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-3 text-outline">diagnosis</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-shadow h-[48px]" id="diagnosis" type="text" value="Acute Bronchitis with mild wheezing"/>
</div>
</div>
<!-- Medication Table Section -->
<div class="space-y-sm">
<div class="flex justify-between items-end">
<h3 class="text-label-md font-label-md text-on-surface">Medications</h3>
<button class="text-primary hover:text-on-primary hover:bg-primary px-3 py-1 rounded-full text-label-sm font-label-sm border border-primary transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">add</span> Add Med
                        </button>
</div>
<div class="bg-surface rounded-lg border border-outline-variant overflow-hidden">
<table class="w-full text-left border-collapse">
<thead>
<tr class="bg-surface-container-low border-b border-outline-variant">
<th class="p-3 text-label-sm font-label-sm text-on-surface-variant w-1/3">Medication Name</th>
<th class="p-3 text-label-sm font-label-sm text-on-surface-variant w-1/4">Frequency</th>
<th class="p-3 text-label-sm font-label-sm text-on-surface-variant">Local Language Instructions</th>
<th class="p-3 w-10"></th>
</tr>
</thead>
<tbody class="divide-y divide-outline-variant text-body-sm font-body-sm">
<tr>
<td class="p-2">
<input class="w-full px-2 py-1.5 bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:bg-surface-container-lowest rounded rounded transition-colors h-[40px]" type="text" value="Amoxicillin 500mg"/>
</td>
<td class="p-2">
<select class="w-full px-2 py-1.5 bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:bg-surface-container-lowest rounded transition-colors h-[40px]">
<option>1x daily</option>
<option>2x daily</option>
<option selected="">3x daily</option>
</select>
</td>
<td class="p-2">
<input class="w-full px-2 py-1.5 bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:bg-surface-container-lowest rounded transition-colors h-[40px]" type="text" value="Tomar con comida (Take with food)"/>
</td>
<td class="p-2 text-center">
<button class="text-outline hover:text-error"><span class="material-symbols-outlined text-[20px]">delete</span></button>
</td>
</tr>
<tr>
<td class="p-2">
<input class="w-full px-2 py-1.5 bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:bg-surface-container-lowest rounded transition-colors h-[40px]" type="text" value="Albuterol Inhaler"/>
</td>
<td class="p-2">
<select class="w-full px-2 py-1.5 bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:bg-surface-container-lowest rounded transition-colors h-[40px]">
<option>As needed</option>
<option selected="">Every 4-6 hours</option>
</select>
</td>
<td class="p-2">
<input class="w-full px-2 py-1.5 bg-transparent border border-transparent hover:border-outline-variant focus:border-primary focus:bg-surface-container-lowest rounded transition-colors h-[40px]" type="text" value="Inhalar si hay tos (Inhale if coughing)"/>
</td>
<td class="p-2 text-center">
<button class="text-outline hover:text-error"><span class="material-symbols-outlined text-[20px]">delete</span></button>
</td>
</tr>
</tbody>
</table>
</div>
</div>
<!-- Advice Section -->
<div class="space-y-sm">
<label class="block text-label-md font-label-md text-on-surface" for="advice">Dietary/General Advice</label>
<textarea class="w-full p-3 bg-surface border border-outline-variant rounded-lg text-body-md font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-shadow resize-y" id="advice" rows="3">Descansar mucho y beber líquidos tibios. Evitar humo y polvo. Regresar a la clínica si la fiebre empeora. (Rest plenty and drink warm fluids. Avoid smoke/dust. Return if fever worsens.)</textarea>
</div>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-outline-variant/50 bg-surface-bright flex justify-end gap-md sticky bottom-0 z-10">
<button class="px-6 py-2.5 rounded-full border border-outline text-on-surface-variant font-label-md text-label-md hover:bg-surface-container-high transition-colors min-h-[48px]">
                    Cancel
                </button>
<button class="px-6 py-2.5 rounded-full bg-primary text-on-primary font-label-md text-label-md shadow-sm hover:bg-surface-tint hover:shadow-md transition-all flex items-center gap-sm min-h-[48px]">
<span class="material-symbols-outlined">send</span>
                    Approve &amp; Dispatch PDF
                </button>
</div>
</div>
</div>
</body></html>
