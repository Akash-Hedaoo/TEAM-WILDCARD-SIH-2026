<style>
  @keyframes pulse-alert {
    0%, 100% { background-color: rgba(255, 218, 214, 0.4); border-color: rgba(186, 26, 26, 0.2); }
    50% { background-color: rgba(255, 218, 214, 1); border-color: rgba(186, 26, 26, 0.6); }
  }
  .animate-pulse-alert {
    animation: pulse-alert 3s ease-in-out infinite;
  }
  
  /* Hide number input arrows for clean UI */
  input[type="number"]::-webkit-inner-spin-button, 
  input[type="number"]::-webkit-outer-spin-button { 
    -webkit-appearance: none; 
    margin: 0; 
  }
  input[type="number"] {
    -moz-appearance: textfield;
  }
</style>

<body class="bg-background min-h-screen text-on-background pb-32">
<header class="bg-surface sticky top-0 z-40 border-b border-outline-variant shadow-sm">
<div class="flex items-center justify-between h-16 px-container-margin-mobile">
<button class="text-on-surface p-2 -ml-2 rounded-full hover:bg-surface-container-highest transition-colors flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Vitals Intake</h1>
<div class="w-10 flex justify-end">
<span class="material-symbols-outlined text-primary">wifi</span>
</div>
</div>
</header>
<main class="px-container-margin-mobile pt-6 flex flex-col gap-gutter max-w-2xl mx-auto">

        R
      </div>
<div class="flex flex-col">
<h2 class="font-headline-md text-headline-md text-on-surface">Ramesh Kumar</h2>
<p class="font-body-md text-body-md text-on-surface-variant">45 yrs • Male</p>
<div class="mt-2 inline-flex items-center gap-1 bg-surface-container px-2 py-1 rounded w-max">
<span class="material-symbols-outlined text-[16px] text-on-surface-variant">pin_drop</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Block C, Sector 4</span>
</div>
</div>
</section>
<section class="grid grid-cols-2 gap-md">
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-md flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[20px] text-error">device_thermostat</span> Temp
        </label>
<div class="flex items-end gap-1 border-b-2 border-error pb-1">
<input class="w-full bg-transparent border-0 focus:ring-0 px-0 font-headline-xl text-headline-xl text-on-surface text-center p-0" type="number" value="103"/>
<span class="font-body-md text-body-md text-on-surface-variant pb-2 shrink-0">°F</span>
</div>
</div>
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-md flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[20px] text-error">monitor_heart</span> Pulse
        </label>
<div class="flex items-end gap-1 border-b-2 border-error pb-1">
<input class="w-full bg-transparent border-0 focus:ring-0 px-0 font-headline-xl text-headline-xl text-on-surface text-center p-0" type="number" value="115"/>
<span class="font-body-md text-body-md text-on-surface-variant pb-2 shrink-0">bpm</span>
</div>
</div>

<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[20px] text-error">blood_pressure</span> Blood Pressure
        </label>
<div class="flex items-end gap-2 border-b-2 border-error pb-1">
<input class="flex-1 bg-transparent border-0 focus:ring-0 px-0 font-headline-xl text-headline-xl text-on-surface text-right p-0" type="number" value="90"/>
<span class="font-headline-xl text-headline-xl text-outline-variant pb-1">/</span>
<input class="flex-1 bg-transparent border-0 focus:ring-0 px-0 font-headline-xl text-headline-xl text-on-surface text-left p-0" type="number" value="55"/>
<span class="font-body-md text-body-md text-on-surface-variant pb-2 shrink-0">mmHg</span>
</div>
</div>

</div>
<div class="flex flex-col gap-2">

<p class="font-body-md text-body-md text-on-error-container">Patient exhibits signs of severe systemic infection or shock. Immediate physician intervention is required.</p>
</div>
</section>

</button>
</div>
<div class="aspect-square rounded-lg bg-surface-container-low border border-dashed border-outline-variant flex items-center justify-center text-outline">
