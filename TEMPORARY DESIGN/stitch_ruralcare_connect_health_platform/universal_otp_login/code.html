                }
            }

<style>
        body {
            background-color: #f8fafc; /* bg-slate-50 alternative for soft gray */
            -webkit-font-smoothing: antialiased;
        }
        
        .role-radio:checked + label {
            background-color: #004ac6; /* primary */
            color: #ffffff; /* on-primary */
        }
        
        /* OTP Input styling */
        .otp-input::-webkit-outer-spin-button,
        .otp-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .otp-input {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-container-margin-mobile md:p-container-margin-desktop font-body-md text-on-surface">
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 overflow-hidden relative z-10 flex flex-col transition-all duration-300">
<!-- Header -->
<header class="p-lg pb-sm text-center">
<div class="flex justify-center mb-md text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="health_and_safety" style="font-variation-settings: 'FILL' 1;">health_and_safety</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-xs">Rural Health Commons</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome Back</p>
</header>
<div class="p-lg pt-sm flex-grow">
<!-- Role Selector -->
<div class="mb-lg">
<p class="font-label-sm text-label-sm text-on-surface-variant mb-sm uppercase tracking-wide">Select Role</p>
<div aria-label="Role selection" class="grid grid-cols-2 md:grid-cols-4 gap-sm bg-surface-container-low p-sm rounded-lg" role="group">
<div class="relative">
<input checked="" class="role-radio sr-only" id="role-patient" name="role" type="radio"/>
<label class="block w-full text-center py-xs px-sm rounded cursor-pointer font-label-md text-label-md text-on-surface hover:bg-surface-container transition-colors" for="role-patient">Patient</label>
</div>
<div class="relative">
<input class="role-radio sr-only" id="role-asha" name="role" type="radio"/>
<label class="block w-full text-center py-xs px-sm rounded cursor-pointer font-label-md text-label-md text-on-surface hover:bg-surface-container transition-colors" for="role-asha">ASHA</label>
</div>
<div class="relative">
<input class="role-radio sr-only" id="role-doctor" name="role" type="radio"/>
<label class="block w-full text-center py-xs px-sm rounded cursor-pointer font-label-md text-label-md text-on-surface hover:bg-surface-container transition-colors" for="role-doctor">Doctor</label>
</div>
<div class="relative">
<input class="role-radio sr-only" id="role-admin" name="role" type="radio"/>
<label class="block w-full text-center py-xs px-sm rounded cursor-pointer font-label-md text-label-md text-on-surface hover:bg-surface-container transition-colors" for="role-admin">Admin</label>
</div>
</div>
</div>
<!-- Login Container (Stateful wrapper for JS) -->
<div class="relative" id="auth-flow-container">
<!-- Step 1: Mobile Input -->
<div class="transition-opacity duration-300 opacity-100" id="step-mobile">
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="mobile">Mobile Number</label>
<div class="flex mb-lg shadow-sm rounded-lg overflow-hidden border border-outline-variant focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<div class="bg-surface-container-low px-md py-md flex items-center border-r border-outline-variant">
<span class="font-body-md text-body-md text-on-surface">+91</span>
</div>
<input autocomplete="tel" class="w-full px-md py-md border-none focus:ring-0 font-body-md text-body-md bg-transparent" id="mobile" pattern="[0-9]{10}" placeholder="Enter your number" type="tel"/>
</div>
<button class="w-full bg-primary text-on-primary py-md rounded-lg font-label-md text-label-md flex items-center justify-center gap-sm hover:bg-surface-tint shadow-sm hover:shadow-md transition-all active:scale-95" id="btn-send-otp" type="button">
                        Send OTP
                        <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
<!-- Step 2: OTP Input (Hidden by default) -->
<div class="absolute top-0 left-0 w-full transition-opacity duration-300 opacity-0 pointer-events-none transform translate-x-4" id="step-otp">
<div class="flex items-center mb-md gap-sm">
<button aria-label="Go back" class="text-on-surface-variant hover:text-primary transition-colors flex items-center p-xs" id="btn-back">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div>
<label class="block font-label-md text-label-md text-on-surface">Enter OTP</label>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sent to +91 ******7890</p>
</div>
</div>
<div class="flex justify-between gap-sm mb-lg">
<input aria-label="Digit 1" class="otp-input w-full aspect-square text-center font-headline-md text-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary bg-transparent" maxlength="1" type="number"/>
<input aria-label="Digit 2" class="otp-input w-full aspect-square text-center font-headline-md text-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary bg-transparent" maxlength="1" type="number"/>
<input aria-label="Digit 3" class="otp-input w-full aspect-square text-center font-headline-md text-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary bg-transparent" maxlength="1" type="number"/>
<input aria-label="Digit 4" class="otp-input w-full aspect-square text-center font-headline-md text-headline-md border border-outline-variant rounded-lg focus:border-primary focus:ring-1 focus:ring-primary bg-transparent" maxlength="1" type="number"/>
</div>
<button class="w-full bg-secondary text-on-secondary py-md rounded-lg font-label-md text-label-md flex items-center justify-center gap-sm hover:bg-secondary-fixed-dim hover:text-on-secondary-fixed shadow-sm hover:shadow-md transition-all active:scale-95 mb-md" id="btn-verify" type="button">
<span class="material-symbols-outlined text-sm" data-icon="verified_user">verified_user</span>
                        Verify &amp; Secure Login
                    </button>
<div class="text-center">
<button class="font-label-sm text-label-sm text-primary hover:underline bg-transparent border-none cursor-pointer" type="button">
                            Resend OTP <span class="text-on-surface-variant" id="timer">(00:30)</span>
</button>
</div>
</div>
</div>
</div>
<!-- Footer -->
<footer class="bg-surface-container p-md border-t border-outline-variant/30 flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-on-surface-variant text-base" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center">Data encrypted &amp; Ayushman Bharat compliant</p>
</footer>
</main>
<script>
        // Minimal interaction logic for demo
        document.addEventListener('DOMContentLoaded', () => {
            const stepMobile = document.getElementById('step-mobile');
            const stepOtp = document.getElementById('step-otp');
            const btnSend = document.getElementById('btn-send-otp');
            const btnBack = document.getElementById('btn-back');
            const otpInputs = document.querySelectorAll('.otp-input');

            // Show OTP step
            btnSend.addEventListener('click', (e) => {
                e.preventDefault();
                stepMobile.classList.replace('opacity-100', 'opacity-0');
                stepMobile.classList.add('pointer-events-none', 'transform', '-translate-x-4');
                
                setTimeout(() => {
                    stepOtp.classList.replace('opacity-0', 'opacity-100');
                    stepOtp.classList.remove('pointer-events-none', 'transform', 'translate-x-4');
                    stepOtp.classList.add('transform', 'translate-x-0');
                    otpInputs[0].focus();
                }, 150);
            });

            // Go back to Mobile step
            btnBack.addEventListener('click', (e) => {
                e.preventDefault();
                stepOtp.classList.replace('opacity-100', 'opacity-0');
                stepOtp.classList.add('pointer-events-none', 'transform', 'translate-x-4');
                stepOtp.classList.remove('transform', 'translate-x-0');
                
                setTimeout(() => {
                    stepMobile.classList.replace('opacity-0', 'opacity-100');
                    stepMobile.classList.remove('pointer-events-none', 'transform', '-translate-x-4');
                }, 150);
            });

            // OTP Input auto-advance
            otpInputs.forEach((input, index) => {
                input.addEventListener('input', function() {
                    if (this.value.length > 1) {
                        this.value = this.value.slice(0, 1);
                    }
                    if (this.value.length === 1 && index < otpInputs.length - 1) {
                        otpInputs[index + 1].focus();
                    }
                });
                
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && !this.value && index > 0) {
                        otpInputs[index - 1].focus();
                    }
                });
            });
        });
    </script>
</body></html>
